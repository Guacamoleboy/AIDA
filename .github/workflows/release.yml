# FILE PURPOSE
#   - Pipeline for CI / CD integration of AIDA.
#   - Instead of using SCP it updates the website on main branch updates.

# ------------------------------------------------------------------------------------------------------

name: AIDA Deployment Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      ## ---- LOGIN TO DOCKER HUB  ---------------------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ## ---- BUILD & PUSH -----------------------------------------------------------------------------

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: guacamoleboy/aida-frontend:latest

      ## ---- DEPLOY TO DROPLET ------------------------------------------------------------------------

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/deployment/aida
            docker compose pull
            docker compose up -d --force-recreate